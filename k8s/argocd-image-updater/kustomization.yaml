apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Upstream Argo CD Image Updater install manifest, pinned. Upgrade = bump the
# tag and re-check https://argocd-image-updater.readthedocs.io/en/stable/
resources:
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v1.3.0/config/install.yaml
  - imageupdater.yaml

patches:
  - path: patches/argocd-image-updater-config.yaml
