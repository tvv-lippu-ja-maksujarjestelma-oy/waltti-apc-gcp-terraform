apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          env:
            # Commit through the GitHub API with the App identity: commits are authored by
            # waltti-image-updater[bot] and signed by GitHub ("Verified"). Needs the GitHub App
            # credentials; git.user/git.email in the ConfigMap are ignored for these commits.
            - name: GIT_COMMIT_METHOD
              value: api
