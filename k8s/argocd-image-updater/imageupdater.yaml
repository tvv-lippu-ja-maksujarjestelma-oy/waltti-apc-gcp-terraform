# Image Updater 1.x is configured through this CR.
#
# Rules are matched most-specific namePattern first.
#  - dev applications: Git write-back. The resolved digest is written to the overlay's
#    kustomization.yaml in waltti-apc-deployment via a pull request opened by the GitHub
#    App waltti-image-updater (credentials: secret argocd/github-app-image-updater).
#    Annotations cannot express pull requests, so these rules are CR-based.
#  - qa and prod: not managed by Image Updater. Their digests live in waltti-apc-deployment
#    and change only through promotion pull requests (scripts/promote-image.sh there).
#    The "*" rule below keeps annotation mode available but no Application uses it.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: waltti
spec:
  applicationRefs:
    - namePattern: anonymizer-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: waltti-apc-anonymizer
          imageName: tvvlmj/waltti-apc-anonymizer:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: gtfsrt-vp-poller-fi-jyvaskyla-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: http-pulsar-poller
          imageName: tvvlmj/http-pulsar-poller:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: gtfsrt-vp-poller-fi-kuopio-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: http-pulsar-poller
          imageName: tvvlmj/http-pulsar-poller:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: gtfsrt-vp-poller-fi-lahti-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: http-pulsar-poller
          imageName: tvvlmj/http-pulsar-poller:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: journey-matcher-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: waltti-apc-journey-matcher
          imageName: tvvlmj/waltti-apc-journey-matcher:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: mqtt-deduplicator-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: pulsar-topic-deduplicator
          imageName: tvvlmj/pulsar-topic-deduplicator:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: mqtt-pulsar-forwarder-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: mqtt-pulsar-forwarder
          imageName: tvvlmj/mqtt-pulsar-forwarder:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: pulsar-mqtt-forwarder-raportointi-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: pulsar-mqtt-forwarder
          imageName: tvvlmj/pulsar-mqtt-forwarder:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: pulsar-mqtt-forwarder-rtpi-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: pulsar-mqtt-forwarder
          imageName: tvvlmj/pulsar-mqtt-forwarder:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: vehicle-anonymization-profiler-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
        # CronJob: between runs no container is running, so Argo's status.summary.images
        # is empty and Image Updater would skip the image. forceUpdate treats it as live.
        forceUpdate: true
      images:
        - alias: waltti-apc-vehicle-anonymization-profiler
          imageName: tvvlmj/waltti-apc-vehicle-anonymization-profiler:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: vehicle-position-splitter-kuopio-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: waltti-apc-vehicle-position-splitter
          imageName: tvvlmj/waltti-apc-vehicle-position-splitter:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: vehicle-position-splitter-lahti-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: waltti-apc-vehicle-position-splitter
          imageName: tvvlmj/waltti-apc-vehicle-position-splitter:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: vehicle-registry-poller-fi-kuopio-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: http-pulsar-poller
          imageName: tvvlmj/http-pulsar-poller:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: vehicle-registry-poller-fi-lahti-dev
      useAnnotations: false
      commonUpdateSettings:
        updateStrategy: digest
      images:
        - alias: http-pulsar-poller
          imageName: tvvlmj/http-pulsar-poller:edge
      writeBackConfig:
        method: git:secret:argocd/github-app-image-updater
        gitConfig:
          writeBackTarget: kustomization
          pullRequest:
            github: {}
    - namePattern: "*"
      useAnnotations: true
