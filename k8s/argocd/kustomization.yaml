apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Upstream Argo CD install manifest, pinned. Upgrade = bump this tag, read the
# matching page under https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/
# and re-verify the patches below.
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.0.23/manifests/install.yaml
  - argocd-backend.yaml
  - argocd-frontend.yaml
  - argocd-service2.yaml
  - argocd-ingress.yaml
  - argocd-cert.yaml

patches:
  # KSOPS + kustomize binaries for the repo-server (GCP KMS via Workload Identity).
  - path: argocd-patch.yaml
  # Workload Identity: repo-server SA -> argocd-gke GSA (holds cloudkms.cryptoKeyDecrypter).
  - path: patches/repo-server-sa.yaml
  # Runtime settings that so far lived only in the live cluster.
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
