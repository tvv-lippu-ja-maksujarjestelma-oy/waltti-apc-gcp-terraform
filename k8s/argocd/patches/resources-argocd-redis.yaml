---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
      - name: redis
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
      initContainers:
      - name: secret-init
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
