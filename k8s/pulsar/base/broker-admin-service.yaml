---
# Internal LoadBalancer for the Pulsar broker admin API (port 8080).
# Used by Terraform (streamnative/pulsar provider) to manage namespace
# retention policies and other Pulsar admin config as code.
# Internal-only: only reachable from within the GCP VPC.
apiVersion: v1
kind: Service
metadata:
  name: pulsar-broker-admin
  namespace: pulsar
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: pulsar
    component: broker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
