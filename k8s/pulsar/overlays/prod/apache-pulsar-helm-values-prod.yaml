---
####################
# Production values #
####################

# Enable persistence for production
volumes:
  persistence: true

# Safer broker behavior for production (do not skip non-recoverable data)
broker:
  configData:
    autoSkipNonRecoverableData: "false"

# Bookie ledger PVC size: expanded from chart default 50Gi to 100Gi after disk-full
# incident (2026-03-24). At 14-day retention, steady-state usage is ~20-25Gi per bookie.
# Note: PVC size cannot be reduced once set; only increased.
#
# Namespace retention policy (set via pulsar-admin, stored in ZooKeeper - NOT managed here):
#   apc-prod/source, deduplicated, anonymized, aggregated, cleaned: 14 days, unlimited size
#   apc-prod/profiles: 100MB size limit
# To update: kubectl exec -n pulsar pulsar-bookie-0 -- /pulsar/bin/pulsar-admin \
#   --admin-url http://pulsar-broker:8080 namespaces set-retention <ns> --time 14d --size -1
bookkeeper:
  volumes:
    ledgers:
      size: 100Gi
  resources:
    requests:
      # Measured peak about 0.78 GiB per bookie (2-15 Nov 2026), then 1.12 GiB on bookie-2
      # (17-19 Nov 2026, non-evictable; mostly native memory outside -Xmx and direct memory).
      # Same value as staging.
      memory: 1280Mi

# Init containers (verify-clusterid, wait-*-ready) count for the whole pod lifetime:
# Autopilot bills the larger of the init and main container requests. The base value
# of 1.0 CPU made each bookie, broker and auto-recovery pod cost 1 vCPU. Staging and
# dev run 0.5. Production startup passed at 0.5 with uncapped bursting (4.7-5.1 s,
# 16 Oct 2026); a 1-CPU cap timed out, so no CPU limit is set here.
initContainer:
  resources:
    requests:
      cpu: 0.5
      memory: 256Mi
