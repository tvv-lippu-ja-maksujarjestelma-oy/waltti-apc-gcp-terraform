---
######################
# Development values #
######################

# Enable persistence to avoid LedgerNotExistException errors when bookies restart
# Previously disabled (emptyDir) which caused data loss on bookie pod restarts
volumes:
  persistence: true

# Disable autoSkipNonRecoverableData now that we have persistent storage
# This setting was a workaround for missing ledgers
broker:
  configData:
    autoSkipNonRecoverableData: "false"

# Bookie ledger PVC size: all 4 bookies expanded to 100Gi on 2026-03-25.
# bookie-2 was at 95% disk usage; others expanded for consistency.
# Note: retention set to 14 days via pulsar-admin (stored in ZooKeeper, not here).
bookkeeper:
  volumes:
    ledgers:
      size: 100Gi
  resources:
    requests:
      # Peak use about 0.05-0.08 vCPU per bookie (2-15 Nov 2026); CPU bursting covers spikes.
      cpu: 0.25
      # Measured peak about 1.6 GiB per bookie (2-15 Nov 2026); chart default 512Mi was below use.
      memory: 2Gi

# In case you have to debug, you can enable toolset:
# components:
#   toolset: true

# Init requests affect the bill for the entire pod lifetime. Keep startup burst
# capacity; the 15-second BookKeeper check is tested before each rollout.
initContainer:
  resources:
    requests:
      cpu: 0.5
      memory: 256Mi
    limits:
      cpu: 1

# CPU requests reduced from 0.5 (Nov 2026 cost review). Peak use per pod 2-15 Nov 2026:
# ZooKeeper about 0.01-0.08 vCPU, auto-recovery about 0.06 vCPU with short spikes covered by CPU bursting.
# 0.25 is accepted by Autopilot for anti-affinity pods (the brokers already run at 0.25).
zookeeper:
  resources:
    requests:
      cpu: 0.25
autorecovery:
  resources:
    requests:
      cpu: 0.25
