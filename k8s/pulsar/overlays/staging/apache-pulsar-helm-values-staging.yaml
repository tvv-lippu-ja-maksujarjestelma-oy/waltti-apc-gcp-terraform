---
####################
# Staging values   #
####################

# Enable persistence for staging
volumes:
  persistence: true

# Safer broker behavior for staging (do not skip non-recoverable data)
broker:
  configData:
    autoSkipNonRecoverableData: "false"

# Bookie ledger PVC size: all 4 bookies expanded to 100Gi on 2026-03-25 (preemptive,
# were at 41-50% with 32-day retention). Retention set to 14 days.
# Note: retention set via pulsar-admin (stored in ZooKeeper, not here).
bookkeeper:
  volumes:
    ledgers:
      size: 100Gi
  resources:
    requests:
      # Measured peak about 1.05 GiB per bookie (2-15 Nov 2026); chart default 512Mi was below use.
      memory: 1280Mi


# Test environments only: ZooKeeper may share nodes (Nov 2026 cost review).
# Autopilot requires 0.5 vCPU for each pod with pod anti-affinity. Peak use per
# ZooKeeper pod was 0.01-0.08 vCPU (2-15 Nov 2026).
# The staging cluster has CPU bursting (no CPU limit) for spikes.
# All three pods may run on one node, so a node loss or a GKE upgrade drain
# can stop the whole test ZooKeeper quorum and with it Pulsar. Prod keeps
# anti-affinity. Bookies, auto-recovery and brokers keep it too: their 0.5 vCPU
# init containers set their bill, so dropping it there would save nothing.
zookeeper:
  affinity:
    anti_affinity: false
  resources:
    requests:
      cpu: 0.25

# Init requests affect the bill for the entire pod lifetime. Keep startup burst
# capacity; the 15-second BookKeeper check is tested before each rollout.
initContainer:
  resources:
    requests:
      cpu: 0.5
      memory: 256Mi
    limits:
      cpu: 1
