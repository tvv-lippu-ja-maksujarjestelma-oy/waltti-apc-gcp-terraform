---
#######################
# Default base values #
#######################

# Disable unnecessary components
components:
  # Vital components:
  # zookeeper: true
  # bookkeeper: true
  # autorecovery: true # bookkeeper
  # broker: true
  # Additional components:
  functions: false
  proxy: false # TODO/DEBUG: Required or not??
  toolset: false
  pulsar_manager: false

# Disable monitoring stack workloads
victoria-metrics-k8s-stack:
  enabled: false
  victoria-metrics-operator:
    enabled: false
  vmsingle:
    enabled: false
  vmagent:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  grafana:
    enabled: false

# Disable monitoring scrapers (*.podMonitors)
# Use private GCP components (*.service.annotations)
# Use SSDs for persistence (*.volumes.data.storageClassName)
# Modify requests for anti-affinity pods for GKE Autopilot General-purpose compute class (*.resources.requests)
autorecovery:
  podMonitor:
    enabled: false
  service:
    annotations:
      networking.gke.io/load-balancer-type: "Internal"
  volumes:
    data:
      storageClassName: premium-rwo
  affinity:
    anti_affinity: true # Documentative explicit default
  resources:
    requests:
      cpu: 0.5 # Default: 0.05
  # CVE-2026-114938: -XX:-UseBASE64Intrinsics disables the vulnerable JVM
  # Base64 intrinsic. Keep it until the live image contains a fixed JVM.
  configData:
    BOOKIE_MEM: > # Chart default plus the CVE flag
      -Xms64m -Xmx64m -XX:-UseBASE64Intrinsics
bookkeeper:
  podMonitor:
    enabled: false
  service:
    annotations:
      networking.gke.io/load-balancer-type: "Internal"
  volumes:
    data:
      storageClassName: premium-rwo
  affinity:
    anti_affinity: true # Documentative explicit default
  resources:
    requests:
      cpu: 0.5 # Default: 0.2
  # CVE-2026-114938: -XX:-UseBASE64Intrinsics disables the vulnerable JVM
  # Base64 intrinsic. Keep it until the live image contains a fixed JVM.
  configData:
    PULSAR_MEM: > # Chart default plus the CVE flag
      -Xms128m -Xmx256m -XX:MaxDirectMemorySize=256m -XX:-UseBASE64Intrinsics
# Oxia server requests are high enough by default (1/1Gi), coordinator is not anti-affinity.
oxia:
  server:
    podMonitor:
      enabled: false
    service:
      annotations:
        networking.gke.io/load-balancer-type: "Internal"
    volumes:
      data:
        storageClassName: premium-rwo
  coordinator:
    podMonitor:
      enabled: false
    service:
      annotations:
        networking.gke.io/load-balancer-type: "Internal"
    volumes:
      data:
        storageClassName: premium-rwo
broker:
  podMonitor:
    enabled: false
  service:
    annotations:
      networking.gke.io/load-balancer-type: "Internal"
  volumes:
    data:
      storageClassName: premium-rwo
  affinity:
    anti_affinity: true # Documentative explicit default
  resources:
    requests:
      cpu: 0.25 # TODO/DEBUG: autoadjust worked, 0.5 requireD?? Default: 0.2
      memory: 768Mi
    limits:
      memory: 768Mi
  configData:
    # Reduce JVM heap+direct to fit within 768Mi limit with headroom for JVM overhead.
    # Default is -Xms128m -Xmx256m -XX:MaxDirectMemorySize=256m (fits in 512Mi but
    # OOMKills under load due to JVM overhead on top of heap+direct).
    # CVE-2026-114938: -XX:-UseBASE64Intrinsics disables the vulnerable JVM
    # Base64 intrinsic. Keep it until the live image contains a fixed JVM.
    PULSAR_MEM: >
      -Xms128m -Xmx256m -XX:MaxDirectMemorySize=128m -XX:-UseBASE64Intrinsics
proxy:
  podMonitor:
    enabled: false
  service:
    annotations:
      networking.gke.io/load-balancer-type: "Internal"
  affinity:
    anti_affinity: true # Documentative explicit default
  volumes:
    data:
      storageClassName: premium-rwo
  resources:
    requests:
      cpu: 0.5 # Default: 0.2
zookeeper:
  podMonitor:
    enabled: false
  service:
    annotations:
      networking.gke.io/load-balancer-type: "Internal"
  volumes:
    data:
      storageClassName: premium-rwo
  affinity:
    anti_affinity: true # Documentative explicit default
  resources:
    requests:
      cpu: 0.5 # Default: 0.1
  # CVE-2026-114938: -XX:-UseBASE64Intrinsics disables the vulnerable JVM
  # Base64 intrinsic. Keep it until the live image contains a fixed JVM.
  configData:
    PULSAR_MEM: > # Chart default plus the CVE flag
      -Xms64m -Xmx128m -XX:-UseBASE64Intrinsics

# Cluster initialization fails with default settings because the unconfigurable
# timeout command introduced in
# https://github.com/apache/pulsar-helm-chart/pull/218/files causes an
# init container to exit before the command returns anything. Testing
# with pulsar-toolset, the following timings could be observed for
# 'bin/bookkeeper shell': 0.25 CPU: ~20sec, 0.50 CPU: ~10sec, 1.00 CPU: ~5sec
# As most/all pods use init containers, this also effects continuous operation,
# not only cluster initialization.
initContainer:
  resources:
    requests:
      # Aims to leave ~10 seconds from allotted 15 seconds to the actual work after JVM initializes
      cpu: 1.0
