apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mqtt-mqtt-duplicator-prod-to-dev-dev
  namespace: argocd
  labels:
    environment: dev
    name: mqtt-mqtt-duplicator-prod-to-dev
spec:
  project: waltti
  source:
    repoURL: https://github.com/tvv-lippu-ja-maksujarjestelma-oy/waltti-apc-deployment.git
    path: manifests/mqtt-mqtt-duplicator/overlays/prod-to-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
